[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pruner-studio"
dynamic = ["version"]
description = "A local-first multi-source music hub and safe playlist organizer (Local, OpenSubsonic, WebDAV, NetEase, HTTP Resolver v2)"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Pruner Studio contributors"}]
dependencies = [
    "qrcode[pil]==8.2",
    "Pillow==12.3.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pycryptodome==4.5.0",
    "pywebview==6.2.1",
    "pystray==0.19.5",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.2", "setuptools==84.0.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]
metadata = ["mutagen>=1.47"]
keyring = ["keyring>=25.0"]

[project.scripts]
pruner-studio = "pruner_studio.app:serve"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "pruner_studio.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["src", "tests/backend"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests/backend"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
