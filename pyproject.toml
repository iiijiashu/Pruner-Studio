[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pruner-studio"
version = "0.1.0"
description = "A local-first music library organizer for personal NetEase Cloud Music accounts"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Pruner Studio contributors"}]
dependencies = ["qrcode[pil]>=8.0,<9"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7"]

[project.scripts]
pruner-studio = "pruner_studio.app:serve"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["src"]
