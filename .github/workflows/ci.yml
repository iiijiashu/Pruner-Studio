name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install portable runtime & lint/test dependencies
        run: python -m pip install starlette==1.10.0 uvicorn==0.54.0 httpx==0.28.1 pycryptodome==4.5.0 Pillow==12.3.0 qrcode==8.2 pytest ruff
      - name: Lint Python sources
        run: ruff check src tests/backend scripts
      - name: Import application and verify the POSIX data lock
        run: |
          PYTHONPATH=src python - <<'PY'
          import tempfile
          from pathlib import Path

          from pruner_studio.app import serve
          from pruner_studio.errors import AppError
          from pruner_studio.instance_lock import DataDirectoryLock

          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              first = DataDirectoryLock(root)
              first.acquire()
              try:
                  try:
                      DataDirectoryLock(root).acquire()
                  except AppError as exc:
                      assert exc.code == "INSTANCE_ALREADY_RUNNING"
                  else:
                      raise AssertionError("second data lock unexpectedly succeeded")
              finally:
                  first.release()
              second = DataDirectoryLock(root)
              second.acquire()
              second.release()
          PY

  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-binary=proxy_tools -r requirements-build.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install pytest ruff
      - name: Python lint and syntax
        shell: pwsh
        run: |
          ruff check src tests/backend scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m compileall -q src tests/backend scripts
      - name: Backend tests (pytest including Stage 3 LAN sync)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src;tests/backend"
          python -m pytest -v
      - name: Frontend tests (all suites including Stage 3)
        shell: pwsh
        run: |
          node tests/frontend/run_all.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/frontend/scan_ui.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem -LiteralPath web/js -Filter *.js -File | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
      - name: Build one-file executable
        shell: pwsh
        run: .\scripts\build-windows.ps1
      - name: Verify PE manifest, bundled assets and headless runtime
        run: .\.venv\Scripts\python.exe scripts/verify-windows.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Pruner-Studio-windows
          path: dist/Pruner-Studio.exe

  android-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Android unit tests, lint, release (R8) and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Pruner-Studio-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
