name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -e ".[build]"
      - name: Backend tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests/backend -v
      - name: Frontend tests
        shell: pwsh
        run: |
          node tests/frontend/run_tests.js
          node tests/frontend/scan_ui.js
          Get-ChildItem -LiteralPath web/js -Filter *.js -File | ForEach-Object { node --check $_.FullName }
      - name: Python syntax
        run: python -m compileall -q src tests/backend
      - name: Build one-file executable
        shell: pwsh
        run: .\scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Pruner-Studio-windows
          path: dist/Pruner-Studio.exe
