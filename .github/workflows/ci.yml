name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Import application and verify the POSIX data lock
        run: |
          PYTHONPATH=src python - <<'PY'
          import tempfile
          from pathlib import Path

          from pruner_studio.app import serve
          from pruner_studio.errors import AppError
          from pruner_studio.instance_lock import DataDirectoryLock

          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              first = DataDirectoryLock(root)
              first.acquire()
              try:
                  try:
                      DataDirectoryLock(root).acquire()
                  except AppError as exc:
                      assert exc.code == "INSTANCE_ALREADY_RUNNING"
                  else:
                      raise AssertionError("second data lock unexpectedly succeeded")
              finally:
                  first.release()
              second = DataDirectoryLock(root)
              second.acquire()
              second.release()
          PY

  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Backend tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests/backend -v
      - name: Frontend tests
        shell: pwsh
        run: |
          node tests/frontend/run_tests.js
          node tests/frontend/scan_ui.js
          Get-ChildItem -LiteralPath web/js -Filter *.js -File | ForEach-Object { node --check $_.FullName }
      - name: Python syntax
        run: python -m compileall -q src tests/backend
      - name: Build one-file executable
        shell: pwsh
        run: .\scripts\build-windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Pruner-Studio-windows
          path: dist/Pruner-Studio.exe
